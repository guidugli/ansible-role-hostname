---
# tasks file for hostname

- name: Validate role input variables
  ansible.builtin.assert:
    that:
      - hostname_name is defined
      - hostname_name is string
      - hostname_name | length > 0
      - (hostname_hosts | default([])) | type_debug == 'list'
      - (hostname_remove_127_0_1_1 | default(false)) | type_debug == 'bool'
    quiet: true
  tags:
    - hostname
    - validate

- name: Validate hostname_hosts list items
  ansible.builtin.assert:
    that:
      - item.ip is defined
      - item.ip is string
      - item.ip | ipaddr != false
      - item.alias is defined
      - item.alias is string
      - item.alias | length > 0
    quiet: true
  loop: "{{ hostname_hosts | default([]) }}"
  when: (hostname_hosts | default([])) | length > 0
  tags:
    - hostname
    - validate

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname_name }}"
  when: (ansible_facts['virtualization_type'] | default('')) not in _container_types
  tags:
    - hostname
    - config

# Updating /etc/hosts is not supported in containers.
# See: https://github.com/moby/moby/issues/22281
- name: Update /etc/hosts
  when: (ansible_facts['virtualization_type'] | default('')) not in _container_types
  tags:
    - hostname
    - config
  block:
    - name: Manage 127.0.1.1 entry in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127.0.1.1'
        line: '127.0.1.1 {{ hostname_name }}'
        mode: '0644'
        owner: root
        group: root
        state: "{{ 'absent' if hostname_remove_127_0_1_1 | default(false) else 'present' }}"
      tags:
        - hostname
        - config

    - name: Manage additional /etc/hosts entries
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ item.ip }}\s+'
        line: '{{ item.ip }} {{ item.alias }}'
        state: present
        mode: '0644'
        owner: root
        group: root
      loop: "{{ hostname_hosts | default([]) }}"
      when: (hostname_hosts | default([])) | length > 0
      tags:
        - hostname
        - config
