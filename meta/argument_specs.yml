---
argument_specs:
  main:
    short_description: Set the system hostname and manage /etc/hosts entries.
    options:
      hostname_name:
        type: str
        required: true
        description:
          - Hostname to configure on the target host.
      hostname_remove_127_0_1_1:
        type: bool
        required: false
        default: false
        description:
          - Remove any /etc/hosts entry that starts with 127.0.1.1.
      hostname_hosts:
        type: list
        required: false
        default: []
        elements: dict
        description:
          - Additional /etc/hosts entries to enforce.
        options:
          ip:
            type: str
            required: true
            description:
              - IP address for the hosts entry.
          alias:
            type: str
            required: true
            description:
              - Host aliases for the hosts entry.
